<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANOTE · Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,900;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #FFFFFF;
      color: #0D0D0D;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ─────────────────────────────────── */
    nav {
      padding: 28px 40px;
      opacity: 0;
      animation: fadeIn 600ms cubic-bezier(0.23,1,0.32,1) 0ms forwards;
    }

    .logo {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #0D0D0D;
    }

    /* ── Main ────────────────────────────────── */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .gear-wrap {
      margin-bottom: 40px;
      opacity: 0;
      animation: scaleIn 700ms cubic-bezier(0.23,1,0.32,1) 100ms forwards;
    }

    .gear-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1.5px solid #E8E8E8;
      display: inline-grid;
      place-items: center;
      position: relative;
    }

    .gear-ring::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: #0D0D0D;
      animation: orbit 1.8s linear infinite;
    }

    @keyframes orbit {
      to { transform: rotate(360deg); }
    }

    .gear-icon {
      font-size: 30px;
      line-height: 1;
      display: inline-block;
      animation: spin 10s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #AAAAAA;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 600ms cubic-bezier(0.23,1,0.32,1) 200ms forwards;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #D97706;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: clamp(48px, 8vw, 80px);
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1.0;
      color: #0D0D0D;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 700ms cubic-bezier(0.23,1,0.32,1) 280ms forwards;
    }

    h1 em {
      font-style: italic;
      font-weight: 400;
      color: #BBBBBB;
    }

    p {
      font-size: 16px;
      color: #999;
      line-height: 1.65;
      max-width: 340px;
      opacity: 0;
      animation: fadeUp 700ms cubic-bezier(0.23,1,0.32,1) 340ms forwards;
    }

    /* ── Footer ──────────────────────────────── */
    footer {
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #F0F0F0;
      opacity: 0;
      animation: fadeIn 600ms cubic-bezier(0.23,1,0.32,1) 500ms forwards;
    }

    .footer-copy {
      font-size: 12px;
      color: #CCCCCC;
      letter-spacing: -0.01em;
    }

    .footer-tag {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #CCCCCC;
    }

    /* ── Keyframes ───────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 480px) {
      nav    { padding: 20px 24px; }
      footer { padding: 20px 24px; }
      main   { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <nav>
    <span class="logo">MANOTE</span>
  </nav>

  <main>
    <div class="gear-wrap">
      <div class="gear-ring">
        <span class="gear-icon">⚙</span>
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      Retour imminent
    </div>

    <h1>Maintenance<br><em>en cours</em></h1>

    <p>Le site est temporairement indisponible.<br>Merci de revenir dans quelques instants.</p>
  </main>

  <footer>
    <span class="footer-copy">© 2026 MANOTE</span>
    <span class="footer-tag">Master Informatique</span>
  </footer>

</body>
</html>
